<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="theme-color" content="#03060a">
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500&family=IBM+Plex+Sans+KR:wght@200;300&family=Saira+Condensed:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#03060a;
  --cy:#7fe3ff;
  --cy-2:#2d90b8;
  --cy-3:#12455e;
  --amber:#ffb648;
  --heat:#ff5b3a;
  --bone:#e6f6ff;
  --line:rgba(127,227,255,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--void)}
body{
  color:var(--bone);
  font-family:'IBM Plex Mono',monospace;
  user-select:none;-webkit-user-select:none;
  position:relative;
}

/* 배경 대기광 */
#bg{position:fixed;inset:0;background:
  radial-gradient(60% 50% at 50% 48%, rgba(20,90,125,.35) 0%, transparent 70%),
  radial-gradient(120% 100% at 50% 120%, rgba(10,50,72,.5) 0%, transparent 60%),
  var(--void);}
/* 주사선 + 비네트 */
#grain{position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(0deg,rgba(127,227,255,.045) 0 1px,transparent 1px 3px);}
#vig{position:fixed;inset:0;pointer-events:none;z-index:41;
  background:radial-gradient(70% 60% at 50% 50%,transparent 40%,rgba(0,0,0,.72) 100%);}

canvas#hud{position:fixed;inset:0;width:100%;height:100%;z-index:10}

/* ── 부팅 ── */
#boot{position:fixed;inset:0;z-index:60;background:var(--void);
  display:flex;flex-direction:column;justify-content:center;
  padding:0 8vw;gap:3px}
#boot .mark{font-family:'Saira Condensed',sans-serif;font-weight:700;
  font-size:clamp(30px,7vw,58px);letter-spacing:.42em;color:var(--cy);
  text-shadow:0 0 26px rgba(127,227,255,.55);margin-bottom:4px}
#boot .sub{font-size:clamp(8px,1.7vw,12px);letter-spacing:.34em;
  color:var(--cy-2);margin-bottom:26px;text-transform:uppercase}
#boot .line{font-size:clamp(10px,2vw,13px);letter-spacing:.12em;
  color:var(--cy-2);white-space:pre;line-height:1.85}
#boot .line b{color:var(--cy);font-weight:400}
#boot .line i{color:var(--amber);font-style:normal}
#boot .skip{position:absolute;bottom:6vh;left:0;right:0;text-align:center;
  font-size:10px;letter-spacing:.3em;color:var(--cy-3);text-transform:uppercase}

/* ── 계기 텍스트 ── */
.panel{position:fixed;z-index:20;font-size:10px;letter-spacing:.16em;
  color:var(--cy-2);text-transform:uppercase;line-height:2}
.panel b{color:var(--cy);font-weight:400}
#pTL{top:calc(env(safe-area-inset-top) + 16px);left:18px}
#pTR{top:calc(env(safe-area-inset-top) + 16px);right:18px;text-align:right}
#pBL{bottom:calc(env(safe-area-inset-bottom) + 128px);left:18px}
#pBR{bottom:calc(env(safe-area-inset-bottom) + 128px);right:18px;text-align:right}

/* ── 자막 ── */
#subs{position:fixed;z-index:25;left:0;right:0;
  bottom:calc(env(safe-area-inset-bottom) + 186px);
  text-align:center;padding:0 7vw;pointer-events:none}
#subEn{font-size:clamp(12px,2.4vw,15px);letter-spacing:.06em;color:var(--cy);
  line-height:1.6;min-height:1.6em;text-shadow:0 0 18px rgba(127,227,255,.4)}
#subKo{margin-top:9px;font-family:'IBM Plex Sans KR',sans-serif;font-weight:200;
  font-size:clamp(15px,3vw,20px);line-height:1.5;color:var(--bone)}

/* ── 하단 조작 ── */
#dock{position:fixed;z-index:30;left:0;right:0;
  bottom:calc(env(safe-area-inset-bottom) + 14px);
  display:flex;flex-direction:column;align-items:center;gap:11px;padding:0 16px}
#status{font-size:10px;letter-spacing:.32em;color:var(--cy-2);text-transform:uppercase}
#talk{
  width:min(78vw,340px);padding:14px 0;background:rgba(10,50,72,.28);
  border:1px solid var(--cy-3);border-radius:2px;color:var(--cy);
  font-family:'Saira Condensed',sans-serif;font-size:14px;
  letter-spacing:.3em;text-transform:uppercase;cursor:pointer;
  backdrop-filter:blur(6px)}
#talk:active{background:var(--cy);color:var(--void)}
#typed{width:min(78vw,340px);padding:11px 13px;background:rgba(5,20,30,.55);
  border:1px solid var(--line);border-radius:2px;color:var(--bone);
  font-family:'IBM Plex Sans KR',sans-serif;font-size:14px;font-weight:300}
#typed:focus{outline:none;border-color:var(--cy-2)}
#gear{position:fixed;z-index:30;top:calc(env(safe-area-inset-top) + 12px);
  left:50%;transform:translateX(-50%);
  background:transparent;border:1px solid var(--line);border-radius:2px;
  color:var(--cy-2);font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.24em;padding:5px 12px;cursor:pointer;text-transform:uppercase}

/* ── 로그 ── */
#log{position:fixed;z-index:20;left:18px;right:18px;
  top:calc(env(safe-area-inset-top) + 74px);
  max-height:26vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  font-size:11px;letter-spacing:.06em;line-height:1.8;color:var(--cy-3);
  display:flex;flex-direction:column;gap:2px;pointer-events:none}
#log .l{opacity:.85}
#log .l.me{color:var(--cy-2)}
#log .l.act{color:var(--amber)}
#log .l.err{color:var(--heat)}

/* ── 설정 ── */
#sheet{position:fixed;inset:0;z-index:70;background:var(--void);
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:34px 24px 60px;
  display:flex;flex-direction:column;gap:13px}
#sheet h1{font-family:'Saira Condensed',sans-serif;font-weight:700;
  font-size:28px;letter-spacing:.3em;color:var(--cy)}
#sheet h2{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--cy);
  margin-top:14px;padding-top:15px;border-top:1px solid var(--line)}
#sheet p{font-family:'IBM Plex Sans KR',sans-serif;font-weight:300;
  font-size:13px;color:#7fa8bd;line-height:1.7}
#sheet label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--cy-2)}
#sheet input{width:100%;padding:12px;background:rgba(5,20,30,.6);
  border:1px solid var(--line);border-radius:2px;color:var(--bone);
  font-family:'IBM Plex Mono',monospace;font-size:14px}
#sheet input:focus{outline:none;border-color:var(--cy)}
#sheet button{align-self:flex-start;margin-top:12px;padding:13px 30px;background:transparent;
  border:1px solid var(--cy);border-radius:2px;color:var(--cy);
  font-family:'Saira Condensed',sans-serif;font-size:14px;
  letter-spacing:.24em;text-transform:uppercase;cursor:pointer}
#sheet button:active{background:var(--cy);color:var(--void)}
.hidden{display:none !important}
:focus-visible{outline:1px solid var(--cy);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="hud"></canvas>
<div id="grain"></div>
<div id="vig"></div>

<!-- 부팅 시퀀스 -->
<div id="boot">
  <div class="mark">J.A.R.V.I.S.</div>
  <div class="sub">Just A Rather Very Intelligent System</div>
  <div id="bootLines"></div>
  <div class="skip">탭하여 건너뛰기</div>
</div>

<!-- 계기 -->
<div class="panel" id="pTL"></div>
<div class="panel" id="pTR"></div>
<div class="panel" id="pBL"></div>
<div class="panel" id="pBR"></div>

<button id="gear">CONFIG</button>
<div id="log"></div>

<div id="subs">
  <div id="subEn"></div>
  <div id="subKo"></div>
</div>

<div id="dock">
  <div id="status">Standby</div>
  <button id="talk">Speak</button>
  <input id="typed" placeholder="또는 여기에 입력">
</div>

<!-- 설정 -->
<div id="sheet" class="hidden">
  <h1>CONFIG</h1>
  <p>키를 넣지 않아도 화면과 부팅은 동작합니다. 대화를 하려면 키가 필요합니다.</p>
  <label for="keyIn">Anthropic API Key</label>
  <input id="keyIn" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
  <label for="nameIn">호칭</label>
  <input id="nameIn" type="text" placeholder="sir" autocomplete="off">

  <h2>Actions</h2>
  <p>실행을 맡길 폰의 웹훅 주소와 동작 이름입니다. 비워두면 대화만 동작합니다.</p>
  <label for="baseIn">Webhook Base</label>
  <input id="baseIn" type="url" placeholder="https://..." autocomplete="off">
  <label for="actIn">Actions</label>
  <input id="actIn" type="text" placeholder="불켜기, 불끄기, 에어컨, 커튼열기, 전화" autocomplete="off">

  <button id="saveBtn">Engage</button>
</div>

<script>
/* ═════════════════════════════════════════════
   상태
   ═════════════════════════════════════════════ */
const MODEL="claude-sonnet-5", MEMORY=14;
const cfg={key:"",name:"sir",base:"",actions:[]};
const $=id=>document.getElementById(id);
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const load=k=>{try{return localStorage.getItem(k)||""}catch(e){return""}};

let mode="boot";              // boot | idle | listening | thinking | speaking
let amp=0;                    // 실시간 입력 레벨 0~1
let speakAmp=0;               // 발화 중 모의 레벨
let bootT=0;

/* ═════════════════════════════════════════════
   HUD 렌더링
   ═════════════════════════════════════════════ */
const cv=$("hud"), ctx=cv.getContext("2d");
let W=0,H=0,CX=0,CY=0,R=0,DPR=1;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2; CY=H*0.44;
  R=Math.min(W*0.40,H*0.28);
}
addEventListener("resize",resize);

const CYAN="127,227,255", HEAT="255,91,58", AMBER="255,182,72";
function tone(){ return mode==="listening"?HEAT:CYAN; }

function ring(r,alpha,width,dash){
  ctx.beginPath();
  ctx.strokeStyle=`rgba(${tone()},${alpha})`;
  ctx.lineWidth=width;
  ctx.setLineDash(dash||[]);
  ctx.arc(CX,CY,r,0,Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);
}

function ticks(r,count,len,alpha,rot,every){
  ctx.strokeStyle=`rgba(${tone()},${alpha})`;
  ctx.lineWidth=1;
  for(let i=0;i<count;i++){
    const a=rot+(i/count)*Math.PI*2;
    const long=(i%(every||5)===0);
    const l=long?len*2:len;
    ctx.beginPath();
    ctx.moveTo(CX+Math.cos(a)*r, CY+Math.sin(a)*r);
    ctx.lineTo(CX+Math.cos(a)*(r+l), CY+Math.sin(a)*(r+l));
    ctx.stroke();
  }
}

function arcSeg(r,from,to,width,alpha){
  ctx.beginPath();
  ctx.strokeStyle=`rgba(${tone()},${alpha})`;
  ctx.lineWidth=width;
  ctx.lineCap="butt";
  ctx.arc(CX,CY,r,from,to);
  ctx.stroke();
}

function brackets(r,grip){
  // 대기 중엔 벌어져 있고 들을 때 조여든다
  const off=(1-grip)*22;
  const s=r*0.34;
  ctx.strokeStyle=`rgba(${tone()},${0.35+grip*0.6})`;
  ctx.lineWidth=2;
  const pts=[[-1,-1],[1,-1],[-1,1],[1,1]];
  for(const [sx,sy] of pts){
    const x=CX+sx*(r+off), y=CY+sy*(r+off);
    ctx.beginPath();
    ctx.moveTo(x-sx*s,y); ctx.lineTo(x,y); ctx.lineTo(x,y-sy*s);
    ctx.stroke();
  }
}

function wave(r,level){
  const N=180;
  ctx.beginPath();
  ctx.strokeStyle=`rgba(${tone()},.65)`;
  ctx.lineWidth=1.4;
  for(let i=0;i<=N;i++){
    const a=(i/N)*Math.PI*2;
    const n=Math.sin(a*7+bootT*3.1)*0.5+Math.sin(a*13-bootT*2.2)*0.3+Math.sin(a*3+bootT*1.4)*0.2;
    const rr=r+n*level*r*0.34;
    const x=CX+Math.cos(a)*rr, y=CY+Math.sin(a)*rr;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath(); ctx.stroke();
}

function reactor(r,pulse){
  const g=ctx.createRadialGradient(CX,CY-r*0.12,r*0.05,CX,CY,r);
  if(mode==="listening"){
    g.addColorStop(0,"rgba(255,240,232,.98)");
    g.addColorStop(.42,"rgba(255,140,96,.92)");
    g.addColorStop(1,"rgba(180,50,25,.05)");
  }else{
    g.addColorStop(0,"rgba(240,253,255,.98)");
    g.addColorStop(.42,"rgba(127,227,255,.92)");
    g.addColorStop(1,"rgba(18,69,94,.05)");
  }
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(CX,CY,r*pulse,0,Math.PI*2); ctx.fill();

  ctx.save();
  ctx.globalAlpha=.5;
  ctx.shadowColor=`rgba(${tone()},.9)`;
  ctx.shadowBlur=44;
  ctx.beginPath(); ctx.arc(CX,CY,r*pulse*0.7,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // 삼각 코어 세그먼트
  ctx.strokeStyle="rgba(255,255,255,.55)";
  ctx.lineWidth=1;
  for(let i=0;i<3;i++){
    const a=bootT*0.4+i*(Math.PI*2/3);
    ctx.beginPath();
    ctx.arc(CX,CY,r*0.62,a,a+0.9);
    ctx.stroke();
  }
}

function draw(){
  bootT+=0.016;
  ctx.clearRect(0,0,W,H);
  if(mode!=="boot"){
    const lvl=mode==="speaking"?speakAmp:amp;
    const grip=(mode==="listening")?1:0;

    ring(R,.14,1);
    ticks(R*1.02,60,4,.28,bootT*0.12,5);
    ring(R*0.86,.10,1,[3,7]);
    arcSeg(R*0.74,bootT*0.6,bootT*0.6+1.9,2,.35);
    arcSeg(R*0.74,bootT*0.6+Math.PI,bootT*0.6+Math.PI+1.1,2,.22);
    arcSeg(R*0.62,-bootT*0.9,-bootT*0.9+2.6,1,.30);
    ring(R*0.50,.18,1);
    wave(R*0.42,0.25+lvl*0.9);
    brackets(R*1.12,grip);
    reactor(R*0.19,1+lvl*0.5+Math.sin(bootT*2)*0.02);
  }
  requestAnimationFrame(draw);
}

/* ═════════════════════════════════════════════
   계기 패널
   ═════════════════════════════════════════════ */
let battery=null;
navigator.getBattery&&navigator.getBattery().then(b=>battery=b).catch(()=>{});

function pad(n){ return String(n).padStart(2,"0"); }
function panels(){
  const d=new Date();
  const t=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $("pTL").innerHTML=
    `SYS <b>ONLINE</b><br>CORE <b>${(97+Math.sin(bootT)*2).toFixed(1)}%</b><br>MODE <b>${mode.toUpperCase()}</b>`;
  $("pTR").innerHTML=
    `<b>${t}</b><br>${d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}).toUpperCase()}<br>${navigator.onLine?"LINK <b>SECURE</b>":"LINK <b>LOST</b>"}`;
  $("pBL").innerHTML=
    `AUDIO <b>${Math.round(amp*100)}%</b><br>MIC <b>${micOn?"LIVE":"IDLE"}</b>`;
  $("pBR").innerHTML= battery
    ? `PWR <b>${Math.round(battery.level*100)}%</b><br>${battery.charging?"CHG <b>ACTIVE</b>":"CELL <b>DISCHG</b>"}`
    : `PWR <b>--</b><br>CELL <b>--</b>`;
}
setInterval(panels,250);

/* ═════════════════════════════════════════════
   부팅 시퀀스
   ═════════════════════════════════════════════ */
const BOOT=[
  ["INITIALISING CORE","OK"],
  ["LOADING PERSONALITY MATRIX","OK"],
  ["CALIBRATING AUDIO INPUT","READY"],
  ["ESTABLISHING NETWORK LINK","SECURE"],
  ["SYNCHRONISING HOUSE SYSTEMS","LINKED"],
  ["DIAGNOSTICS","ALL SYSTEMS NOMINAL"]
];

function greeting(){
  const h=new Date().getHours();
  return h<5?"Good evening":h<12?"Good morning":h<18?"Good afternoon":"Good evening";
}

let bootDone=false;
async function runBoot(){
  const box=$("bootLines");
  for(const [label,val] of BOOT){
    if(bootDone) break;
    const el=document.createElement("div");
    el.className="line";
    const dots=".".repeat(Math.max(2,34-label.length));
    el.innerHTML=`${label} ${dots} <b>${val}</b>`;
    box.appendChild(el);
    await wait(230+Math.random()*180);
  }
  if(!bootDone){
    const el=document.createElement("div");
    el.className="line";
    el.innerHTML=`<i>SYSTEM ONLINE</i>`;
    box.appendChild(el);
    await wait(520);
  }
  finishBoot();
}

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function finishBoot(){
  if(bootDone) return;
  bootDone=true;
  $("boot").style.transition="opacity .7s";
  $("boot").style.opacity="0";
  setTimeout(()=>$("boot").classList.add("hidden"),720);
  mode="idle"; setStatus();

  const en=`${greeting()}, ${cfg.name}. All systems are online.`;
  const ko=`${greeting()==="Good morning"?"좋은 아침입니다":greeting()==="Good afternoon"?"안녕하십니까":"좋은 저녁입니다"}, 모든 시스템이 정상입니다.`;
  showSubs(en,ko);
  await speak(en);
  setStatus();
}

/* ═════════════════════════════════════════════
   자막 · 로그
   ═════════════════════════════════════════════ */
function showSubs(en,ko){ $("subEn").textContent=en||""; $("subKo").textContent=ko||""; }
function addLog(text,kind){
  const el=document.createElement("div");
  el.className="l "+(kind||"");
  el.textContent=text;
  $("log").appendChild(el);
  $("log").scrollTop=$("log").scrollHeight;
  while($("log").children.length>40) $("log").removeChild($("log").firstChild);
}
function setStatus(){
  $("status").textContent=
    mode==="listening"?"Receiving":mode==="thinking"?"Processing":
    mode==="speaking"?"Transmitting":"Standby";
  $("talk").textContent=mode==="listening"?"Listening":"Speak";
}

/* ═════════════════════════════════════════════
   음성 출력
   ═════════════════════════════════════════════ */
let enVoice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  enVoice = vs.find(v=>/daniel/i.test(v.name)) ||
            vs.find(v=>v.lang==="en-GB"&&/arthur|oliver|george|male/i.test(v.name)) ||
            vs.find(v=>v.lang==="en-GB") ||
            vs.find(v=>v.lang.startsWith("en")) || null;
}
speechSynthesis.onvoiceschanged=pickVoice; pickVoice();

function speak(text){
  return new Promise(done=>{
    if(!text){ done(); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-GB"; if(enVoice) u.voice=enVoice;
    u.rate=.94; u.pitch=.8;
    mode="speaking"; setStatus();
    let osc=0;
    const anim=setInterval(()=>{ osc+=0.35; speakAmp=0.35+Math.abs(Math.sin(osc))*0.45; },50);
    const fin=()=>{ clearInterval(anim); speakAmp=0; mode="idle"; setStatus(); done(); };
    u.onend=fin; u.onerror=fin;
    speechSynthesis.speak(u);
  });
}

/* ═════════════════════════════════════════════
   음성 입력
   ═════════════════════════════════════════════ */
let recog=null, listening=false, micOn=false, analyser=null, buf=null;

async function initMic(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const actx=new (window.AudioContext||window.webkitAudioContext)();
    actx.createMediaStreamSource(stream).connect(analyser=actx.createAnalyser());
    analyser.fftSize=256; buf=new Uint8Array(analyser.frequencyBinCount);
    micOn=true; meter();
  }catch(e){ micOn=false; }
}
function meter(){
  if(analyser){
    analyser.getByteFrequencyData(buf);
    let s=0; for(let i=0;i<buf.length;i++) s+=buf[i];
    const v=s/buf.length/255;
    amp = mode==="listening" ? v : v*0.25;
  }
  requestAnimationFrame(meter);
}

function initRecog(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ addLog("음성 인식 미지원 브라우저","err"); return null; }
  const r=new SR();
  r.lang="ko-KR"; r.continuous=false; r.interimResults=false;
  r.onresult=e=>{ const t=e.results[0][0].transcript.trim(); if(t) ask(t); };
  r.onerror=e=>{
    listening=false; mode="idle"; setStatus();
    if(e.error==="not-allowed") addLog("마이크 권한 거부됨","err");
  };
  r.onend=()=>{ listening=false; if(mode==="listening"){ mode="idle"; setStatus(); } };
  return r;
}

function listen(){
  if(!bootDone){ finishBoot(); return; }
  if(!recog) recog=initRecog();
  if(!recog||listening) return;
  speechSynthesis.cancel();
  try{ listening=true; mode="listening"; setStatus(); recog.start(); }
  catch(e){ listening=false; mode="idle"; setStatus(); }
}

/* ═════════════════════════════════════════════
   두뇌
   ═════════════════════════════════════════════ */
const TOOLS=[
  {
    name:"action",
    description:"Send a command to the phone unit which carries out physical actions: lights, air conditioner, curtains, calls, messages. Only names on the registered list may be used.",
    input_schema:{type:"object",properties:{
      name:{type:"string"}, value:{type:"string"}
    },required:["name"]}
  },
  {type:"web_search_20250305",name:"web_search"}
];

function persona(){
  const d=new Date().toLocaleString("ko-KR",{weekday:"long",hour:"2-digit",minute:"2-digit"});
  return `You are J.A.R.V.I.S., Tony Stark's AI butler, addressing the user as "${cfg.name}".

MANNER
- English, formal, dry, understated. A British butler running a house full of machines.
- Two sentences at most. You are heard, not read.
- No exclamations, no emoji, no enthusiasm. Wit is deadpan and rare.
- Say plainly when a plan is unwise. Admit ignorance at once. Never invent facts.
- No markdown, no bullets, no asterisks.

OUTPUT FORMAT — mandatory, every reply:
EN| <the English line you speak>
KO| <the same line in natural Korean>
Nothing else.

BEHAVIOUR
- Act first, report after, in one sentence.
- Physical things go through the action tool. Facts go through web search.
- Offer one obviously useful next step as a question when context makes it obvious. Never more than one.

CONTEXT
- Time: ${d}
- Actions available: ${cfg.actions.length?cfg.actions.join(", "):"none"}`;
}

let history=[];
const textOf=c=>(c||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();

async function api(payload){
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"content-type":"application/json","x-api-key":cfg.key,
      "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify(payload)
  });
  if(!r.ok) throw new Error(r.status===401?"인증 실패 — 키 확인":r.status===429?"요청 과다":`오류 ${r.status}`);
  return r.json();
}

async function runAction(name,value){
  if(!cfg.base) return "Phone unit not configured.";
  const hit=cfg.actions.find(a=>a===name)||cfg.actions.find(a=>a.includes(name)||name.includes(a));
  if(!hit) return `No action named "${name}". Available: ${cfg.actions.join(", ")||"none"}`;
  let url=cfg.base.replace(/\/+$/,"")+"/"+encodeURIComponent(hit);
  if(value) url+="?value="+encodeURIComponent(value);
  addLog(`▸ ${hit}${value?" : "+value:""}`,"act");
  try{ await fetch(url,{mode:"no-cors"}); return `"${hit}" dispatched.`; }
  catch(e){ return `Dispatch failed: ${e.message}`; }
}

function split(raw){
  const en=(raw.match(/EN\|\s*(.+)/)||[])[1]||"";
  const ko=(raw.match(/KO\|\s*(.+)/)||[])[1]||"";
  return (en||ko)?{en:en.trim(),ko:ko.trim()}:{en:raw.trim(),ko:""};
}

async function ask(text){
  if(!cfg.key){
    showSubs("Authentication required, sir.","인증이 필요합니다. CONFIG에서 키를 입력해 주십시오.");
    await speak("Authentication required, sir.");
    return;
  }
  addLog(`> ${text}`,"me");
  showSubs("","");
  mode="thinking"; setStatus();

  history.push({role:"user",content:text});
  if(history.length>MEMORY*2) history=history.slice(-MEMORY*2);

  try{
    for(let i=0;i<6;i++){
      const d=await api({model:MODEL,max_tokens:900,system:persona(),tools:TOOLS,messages:history});
      history.push({role:"assistant",content:d.content});

      if(d.stop_reason==="pause_turn"){ history.push({role:"user",content:"Continue."}); continue; }

      if(d.stop_reason!=="tool_use"){
        const {en,ko}=split(textOf(d.content));
        showSubs(en,ko); addLog(ko||en);
        await speak(en);
        return;
      }
      const out=[];
      for(const b of d.content){
        if(b.type!=="tool_use") continue;
        out.push({type:"tool_result",tool_use_id:b.id,
          content:String(await runAction(b.input?.name||"", b.input?.value||""))});
      }
      if(!out.length) continue;
      history.push({role:"user",content:out});
    }
  }catch(e){
    addLog(e.message,"err");
    showSubs("A system fault, sir.","시스템 오류가 발생했습니다.");
    mode="idle"; setStatus();
  }
}

/* ═════════════════════════════════════════════
   조작
   ═════════════════════════════════════════════ */
$("talk").addEventListener("click",listen);
$("boot").addEventListener("click",finishBoot);
$("typed").addEventListener("keydown",e=>{
  if(e.key==="Enter"){ const t=e.target.value.trim(); if(t){ e.target.value=""; e.target.blur(); ask(t);} }
});

$("gear").addEventListener("click",()=>{
  $("keyIn").value=cfg.key; $("nameIn").value=cfg.name;
  $("baseIn").value=cfg.base; $("actIn").value=cfg.actions.join(", ");
  $("sheet").classList.remove("hidden");
});
$("saveBtn").addEventListener("click",()=>{
  cfg.key=$("keyIn").value.trim();
  cfg.name=$("nameIn").value.trim()||"sir";
  cfg.base=$("baseIn").value.trim();
  cfg.actions=$("actIn").value.split(",").map(s=>s.trim()).filter(Boolean);
  save("j_key",cfg.key); save("j_name",cfg.name);
  save("j_base",cfg.base); save("j_act",$("actIn").value);
  $("sheet").classList.add("hidden");
  if(!micOn) initMic();
});

/* ═════════════════════════════════════════════
   기동
   ═════════════════════════════════════════════ */
cfg.key=load("j_key"); cfg.name=load("j_name")||"sir";
cfg.base=load("j_base");
cfg.actions=load("j_act").split(",").map(s=>s.trim()).filter(Boolean);

resize(); draw(); panels();

// iOS는 첫 조작 안에서 소리를 한 번 내야 이후 발화가 허용됨
function unlock(){
  const w=new SpeechSynthesisUtterance(" "); w.volume=0;
  speechSynthesis.speak(w);
  initMic();
  document.removeEventListener("touchstart",unlock);
  document.removeEventListener("click",unlock);
}
document.addEventListener("touchstart",unlock,{once:true});
document.addEventListener("click",unlock,{once:true});

runBoot();

if("serviceWorker" in navigator){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
